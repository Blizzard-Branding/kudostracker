<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Networking KPI + Kudos</title>
<style>
:root{--ink:#172033;--muted:#667085;--paper:#f7f8fb;--card:#fff;--accent:#6f4cff;--accent2:#efeaff;--gold:#f4b740;--green:#15803d;--line:#e6e8ef;--danger:#b42318}
*{box-sizing:border-box} body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--paper);color:var(--ink)}
button,input,select,textarea{font:inherit}.app{max-width:1120px;margin:auto;min-height:100vh}.top{padding:26px 22px 14px;display:flex;justify-content:space-between;gap:20px;align-items:center}.brand h1{font-size:clamp(22px,4vw,34px);margin:0}.brand p{margin:4px 0 0;color:var(--muted)}
.nav{display:flex;gap:8px;padding:0 22px 18px;overflow:auto}.nav button{border:0;background:white;padding:10px 14px;border-radius:999px;box-shadow:0 1px 2px #0001;white-space:nowrap;cursor:pointer}.nav button.active{background:var(--ink);color:white}
main{padding:0 22px 40px}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 8px 30px #17203308}.card h2,.card h3{margin:0 0 12px}.hero{background:linear-gradient(135deg,#171b2c,#4733a8);color:white;border:0}.hero p{color:#d9d7ef}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.big{border:0;border-radius:14px;padding:16px;font-weight:800;cursor:pointer}.big.primary{background:white;color:#2f1f84}.big.kudos{background:#f3c34d;color:#2c2307}
.rankrow{display:grid;grid-template-columns:42px 1fr auto;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.rankrow:last-child{border:0}.rank{font-weight:800;color:var(--muted)}.score{font-weight:900}.bar{height:6px;background:#eee;border-radius:999px;overflow:hidden;margin-top:6px}.bar span{display:block;height:100%;background:var(--accent);border-radius:999px}.feed{display:flex;flex-direction:column;gap:10px}.feeditem{padding:12px;border-radius:12px;background:#fafafe;border:1px solid var(--line)}.feeditem small{color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.badge{padding:12px;border-radius:14px;background:#fffaf0;border:1px solid #f6e2ae}.badge b{display:block;margin-bottom:4px}.empty{color:var(--muted);font-style:italic}
.form{max-width:650px;margin:auto}.field{margin-bottom:14px}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #d7dae3;border-radius:11px;background:white}.field textarea{min-height:90px;resize:vertical}.roles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.hint{font-size:13px;color:var(--muted);margin-top:5px}.submit{width:100%;border:0;background:var(--accent);color:#fff;padding:14px;border-radius:12px;font-weight:900;cursor:pointer}.notice{background:#eff8ff;border:1px solid #b2ddff;padding:12px;border-radius:12px;margin-bottom:16px;color:#1849a9}.success{background:#ecfdf3;border-color:#abefc6;color:#067647}
.tblwrap{overflow:auto}.tbl{width:100%;border-collapse:collapse}.tbl th,.tbl td{text-align:left;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}.tbl th{font-size:12px;text-transform:uppercase;color:var(--muted)}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--accent2);color:#4338ca;font-size:12px;font-weight:800}
.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.memberedit{display:grid;grid-template-columns:1fr 110px;gap:8px;margin:8px 0}.secondary{border:1px solid var(--line);background:#fff;padding:10px 12px;border-radius:10px;cursor:pointer}.danger{color:var(--danger)}
@media(max-width:760px){.grid,.admin-grid{grid-template-columns:1fr}.actions,.badges,.roles{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.top .pill{align-self:flex-start}}
</style>
</head>
<body><div class="app">
<header class="top"><div class="brand"><h1>Networking KPI + Kudos</h1><p>Connection, contribution, accountability — without the spreadsheet headache.</p></div><span class="pill">V1 prototype</span></header>
<nav class="nav" id="nav"></nav><main id="main"></main></div>
<script>
const SEED={"members": [{"name": "Aubrey", "goal": 24.0}, {"name": "Leo", "goal": 24.0}, {"name": "Brian", "goal": 24.0}, {"name": "Amy", "goal": 24.0}, {"name": "Abby", "goal": 24.0}, {"name": "Arend", "goal": 24.0}, {"name": "Mo", "goal": 24.0}, {"name": "Kay", "goal": 24.0}, {"name": "Mischa", "goal": 24.0}], "key": [{"type": "Referral Given", "p1": 5.0, "role1": "Referrer", "p2": 0.0, "role2": "Recipient", "p3": 0.0, "role3": null, "description": "Passed a referral to another member — logs who it went to."}, {"type": "One-on-One Meeting", "p1": 3.0, "role1": "Attendee", "p2": 3.0, "role2": "Attendee", "p3": 0.0, "role3": null, "description": "Both people get credit for a completed 1:1."}, {"type": "Meeting Attendance", "p1": 2.0, "role1": "Attendee", "p2": 2.0, "role2": "Attendee", "p3": 2.0, "role3": "Attendee", "description": "Attended the group's regular meeting — log up to 3 people on one row."}, {"type": "Visitor Brought", "p1": 8.0, "role1": "Inviter", "p2": 8.0, "role2": "Co-Inviter", "p3": 0.0, "role3": null, "description": "Brought a guest/prospective member to a meeting."}, {"type": "Testimonial Given", "p1": 4.0, "role1": "Giver", "p2": 0.0, "role2": "Recipient", "p3": 0.0, "role3": null, "description": "Gave a testimonial for another member's business."}, {"type": "Closed Business", "p1": "Goal-based", "role1": "Closer", "p2": "% of Closer, see below", "role2": "Referrer (bonus)", "p3": 0.0, "role3": null, "description": "A referral turned into real business. Points are personalized: see the Closed Business Settings below — Closer earns points off THEIR annual goal x job size; Referrer gets a % bonus of that."}, {"type": "Social Shoutout", "p1": 2.0, "role1": "Giver", "p2": 0.0, "role2": "Recipient", "p3": 0.0, "role3": null, "description": "Public shoutout/mention on social media or LinkedIn."}, {"type": "Connector Bonus", "p1": 4.0, "role1": "Connector", "p2": 0.0, "role2": "Connected: Person A", "p3": 0.0, "role3": "Connected: Person B", "description": "Introduced two members to each other."}, {"type": "Multi-Referral Streak", "p1": 6.0, "role1": "Member", "p2": 0.0, "role2": null, "p3": 0.0, "role3": null, "description": "Gave referrals to 3+ different members in a single month."}, {"type": "Recruited a New Member", "p1": 10.0, "role1": "Recruiter", "p2": 0.0, "role2": "New Member", "p3": 0.0, "role3": null, "description": "Brought in an actual new paying/joining member (not just a visitor)."}, {"type": "New Member Mentor", "p1": 4.0, "role1": "Mentor", "p2": 0.0, "role2": "New Member", "p3": 0.0, "role3": null, "description": "Onboarded or showed the ropes to a newer member."}, {"type": "Review Left", "p1": 3.0, "role1": "Reviewer", "p2": 0.0, "role2": "Reviewed", "p3": 0.0, "role3": null, "description": "Wrote a review for a teammate's business."}, {"type": "Cross-Promotion", "p1": 3.0, "role1": "Promoter", "p2": 0.0, "role2": "Featured Member", "p3": 0.0, "role3": null, "description": "Featured another member on your own social media, newsletter, or email list."}, {"type": "Feedback Given", "p1": 2.0, "role1": "Giver", "p2": 0.0, "role2": "Recipient", "p3": 0.0, "role3": null, "description": "Gave real, useful feedback on someone's pitch, website, or marketing."}, {"type": "Perfect Attendance Streak", "p1": 5.0, "role1": "Member", "p2": 0.0, "role2": null, "p3": 0.0, "role3": null, "description": "No missed meetings across a full quarter."}, {"type": "Meeting Role Volunteer", "p1": 2.0, "role1": "Volunteer", "p2": 2.0, "role2": "Co-Volunteer", "p3": 0.0, "role3": null, "description": "Served as greeter, timekeeper, or ran a meeting segment."}, {"type": "Hosted an Event", "p1": 8.0, "role1": "Host", "p2": 8.0, "role2": "Co-Host", "p3": 0.0, "role3": null, "description": "Opened up their business for a mixer, lunch-and-learn, or open house."}, {"type": "Big Ask Fulfilled", "p1": 3.0, "role1": "Helper", "p2": 0.0, "role2": "Requester", "p3": 0.0, "role3": null, "description": "Answered someone's help request posted to the group."}, {"type": "Spotlight/Presenter", "p1": 5.0, "role1": "Presenter", "p2": 0.0, "role2": null, "p3": 0.0, "role3": null, "description": "Gave a deeper presentation on their own business to the group."}, {"type": "Content Collab", "p1": 5.0, "role1": "Collaborator A", "p2": 5.0, "role2": "Collaborator B", "p3": 5.0, "role3": "Collaborator C", "description": "Co-hosted a webinar or created content together."}, {"type": "Story Share", "p1": 3.0, "role1": "Sharer", "p2": 0.0, "role2": "Featured Member", "p3": 0.0, "role3": null, "description": "Shared a case study or success story that came from a group referral."}, {"type": "Kudos", "p1": 0.0, "role1": "Giver (no points)", "p2": 1.0, "role2": "Receiver (gets the star)", "p3": 0.0, "role3": null, "description": "Quick peer recognition — replaces the old Kudos Matrix tab."}], "multipliers": {"Small": 0.5, "Medium": 1.0, "Large": 2.0}, "refBonus": 0.5, "activities": [{"id": "seed-2", "date": "2026-08-24", "type": "Referral Given", "p1": "Aubrey", "p2": "Kay", "p3": null, "jobSize": "Medium", "notes": "Example row — Aubrey referred Kay to a potential client. Overwrite or delete this row.", "value": "", "seeded": true}, {"id": "seed-3", "date": "2026-08-27", "type": "Closed Business", "p1": "Mischa", "p2": "Aubrey", "p3": null, "jobSize": "Medium", "notes": "Example row — Aubrey's referral turned into a portrait session. Overwrite or delete this row.", "value": "", "seeded": true}, {"id": "seed-4", "date": "2026-09-02", "type": "One-on-One Meeting", "p1": "Aubrey", "p2": "Abby", "p3": "Mo", "jobSize": "Medium", "notes": "", "value": "", "seeded": true}, {"id": "seed-5", "date": "2026-09-03", "type": "One-on-One Meeting", "p1": "Aubrey", "p2": "Kay", "p3": null, "jobSize": "Medium", "notes": "", "value": "", "seeded": true}, {"id": "seed-6", "date": "2026-09-04", "type": "One-on-One Meeting", "p1": "Aubrey", "p2": "Mischa", "p3": null, "jobSize": "Medium", "notes": "", "value": "", "seeded": true}, {"id": "seed-7", "date": "2026-09-02", "type": "Meeting Attendance", "p1": "Aubrey", "p2": "Leo", "p3": "Brian", "jobSize": "Medium", "notes": "", "value": "", "seeded": true}, {"id": "seed-8", "date": "2026-09-02", "type": "Meeting Attendance", "p1": "Amy", "p2": "Abby", "p3": "Mo", "jobSize": "Medium", "notes": "", "value": "", "seeded": true}, {"id": "seed-9", "date": "2026-09-02", "type": "Meeting Attendance", "p1": "Mischa", "p2": "Kay", "p3": null, "jobSize": "Medium", "notes": "", "value": "", "seeded": true}, {"id": "seed-10", "date": "2026-09-02", "type": "Meeting Role Volunteer", "p1": "Abby", "p2": "Aubrey", "p3": null, "jobSize": "Medium", "notes": "Lunch duties and Convener", "value": "", "seeded": true}, {"id": "seed-11", "date": "2026-09-02", "type": "Hosted an Event", "p1": "Amy", "p2": null, "p3": null, "jobSize": "Medium", "notes": "Venue", "value": "", "seeded": true}, {"id": "seed-12", "date": "2026-09-16", "type": "Referral Given", "p1": "Amy", "p2": "Kay", "p3": null, "jobSize": "Medium", "notes": "", "value": "", "seeded": true}, {"id": "seed-13", "date": "2026-09-16", "type": "Closed Business", "p1": "Kay", "p2": "Amy", "p3": null, "jobSize": "Small", "notes": "Work on Amy's house", "value": "", "seeded": true}, {"id": "seed-14", "date": "2026-09-16", "type": "Referral Given", "p1": "Abby", "p2": null, "p3": null, "jobSize": "Medium", "notes": "Referred business to Mari", "value": "", "seeded": true}, {"id": "seed-15", "date": "2026-09-16", "type": "Referral Given", "p1": "Aubrey", "p2": "Leo", "p3": null, "jobSize": "Medium", "notes": "", "value": "", "seeded": true}, {"id": "seed-16", "date": "2026-09-16", "type": "Closed Business", "p1": "Aubrey", "p2": "Leo", "p3": null, "jobSize": "Small", "notes": "Book cover design", "value": "", "seeded": true}, {"id": "seed-17", "date": "2026-09-16", "type": "Referral Given", "p1": "Abby", "p2": "Mo", "p3": null, "jobSize": "Small", "notes": "SIMPLE IRA set-up", "value": "", "seeded": true}, {"id": "seed-18", "date": "2026-09-16", "type": "One-on-One Meeting", "p1": "Mischa", "p2": "Kay", "p3": null, "jobSize": "Medium", "notes": "", "value": "", "seeded": true}, {"id": "seed-19", "date": "2026-09-16", "type": "One-on-One Meeting", "p1": "Aubrey", "p2": "Kay", "p3": null, "jobSize": "Medium", "notes": "", "value": "", "seeded": true}, {"id": "seed-20", "date": "2026-09-16", "type": "Closed Business", "p1": "Aubrey", "p2": "Mo", "p3": "Brian", "jobSize": "Medium", "notes": "", "value": "", "seeded": true}, {"id": "seed-21", "date": "2026-09-16", "type": "Meeting Attendance", "p1": "Aubrey", "p2": "Leo", "p3": "Amy", "jobSize": "Medium", "notes": "", "value": "", "seeded": true}, {"id": "seed-22", "date": "2026-09-16", "type": "Meeting Attendance", "p1": "Abby", "p2": "Arend", "p3": "Mo", "jobSize": "Medium", "notes": "", "value": "", "seeded": true}, {"id": "seed-23", "date": "2026-09-16", "type": "Meeting Attendance", "p1": "Kay", "p2": "Mischa", "p3": null, "jobSize": "Medium", "notes": "", "value": "", "seeded": true}, {"id": "seed-24", "date": "2026-09-16", "type": "Testimonial Given", "p1": "Abby", "p2": null, "p3": null, "jobSize": "Medium", "notes": "Received 15 new clients as result of social shoutoutn from Mari", "value": "", "seeded": true}]};
const STORE='networking-kpi-v1';
let state=JSON.parse(localStorage.getItem(STORE)||'null') || JSON.parse(JSON.stringify(SEED));
let view='dashboard';
const save=()=>localStorage.setItem(STORE,JSON.stringify(state));
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const member=n=>state.members.find(x=>x.name===n);
const cfg=t=>state.key.find(x=>x.type===t);
function ptsFor(a){
 const c=cfg(a.type); if(!c)return [0,0,0];
 if(a.type==='Closed Business'){
   // App enforces canonical roles: p1 closer, p2 referrer.
   const g=member(a.p1)?.goal||24, mult=state.multipliers[a.jobSize||'Medium']||1;
   const closer=Math.round((100/g)*mult*100)/100;
   return [closer,Math.round(closer*state.refBonus*100)/100,0];
 }
 return [Number(c.p1)||0,Number(c.p2)||0,Number(c.p3)||0];
}
function scores(){let out=Object.fromEntries(state.members.map(m=>[m.name,0]));state.activities.forEach(a=>{let p=ptsFor(a);[a.p1,a.p2,a.p3].forEach((n,i)=>{if(n&&out[n]!==undefined)out[n]+=p[i]||0})});return out}
function countType(name,type,roleSlot,from){return state.activities.filter(a=>a.type===type&&a[roleSlot]===name&&(!from||new Date(a.date)>=from)).length}
function dateStartMonth(){let d=new Date();return new Date(d.getFullYear(),d.getMonth(),1)}
function dateStartQuarter(){let d=new Date();return new Date(d.getFullYear(),Math.floor(d.getMonth()/3)*3,1)}
function badgeWinner(type,slot,from){let vals=state.members.map(m=>[m.name,countType(m.name,type,slot,from)]);let max=Math.max(...vals.map(x=>x[1]));if(!max)return ['No data yet','—'];let winners=vals.filter(x=>x[1]===max).map(x=>x[0]);return [winners.join(' & '),max]}
function badges(){return [
 ['Rainmaker','Most business closed this quarter',...badgeWinner('Closed Business','p1',dateStartQuarter())],
 ['Top Referral Source','Most referred business closed this quarter',...badgeWinner('Closed Business','p2',dateStartQuarter())],
 ['Networking Ninja','Most 1:1s this month',...badgeWinner('One-on-One Meeting','p1',dateStartMonth())],
 ['MVP','Most Kudos received this month',...badgeWinner('Kudos','p2',dateStartMonth())]
]}
function recent(){return [...state.activities].filter(a=>a.date).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8)}
function activityText(a){
 if(a.type==='Kudos')return `👏 ${esc(a.p1)} gave Kudos to <b>${esc(a.p2)}</b>${a.notes?`: “${esc(a.notes)}”`:''}`;
 if(a.type==='Closed Business')return `💼 <b>${esc(a.p1)}</b> closed ${esc((a.jobSize||'medium').toLowerCase())} business${a.p2?` from a referral by ${esc(a.p2)}`:''}`;
 if(a.type==='Referral Given')return `🤝 <b>${esc(a.p1)}</b> gave a referral${a.p2?` to ${esc(a.p2)}`:''}`;
 if(a.type==='One-on-One Meeting')return `☕ ${esc(a.p1)} + ${esc(a.p2||'')} completed a 1:1`;
 return `⭐ <b>${esc(a.p1||'Someone')}</b> — ${esc(a.type)}${a.p2?` with ${esc(a.p2)}`:''}`;
}
function go(v){view=v;render()}
function nav(){let items=[['dashboard','Dashboard'],['log','Log Activity'],['kudos','Give Kudos'],['history','Activity'],['admin','Admin']];document.getElementById('nav').innerHTML=items.map(([v,l])=>`<button class="${view===v?'active':''}" onclick="go('${v}')">${l}</button>`).join('')}
function dashboard(){let s=scores(), sorted=Object.entries(s).sort((a,b)=>b[1]-a[1]),max=Math.max(1,...Object.values(s));return `<div class="grid"><section class="card hero"><h2>Make the connections count.</h2><p>Log the helpful stuff while it’s fresh. The points, badges and leaderboard take care of themselves.</p><div class="actions"><button class="big primary" onclick="go('log')">＋ Log Activity</button><button class="big kudos" onclick="go('kudos')">👏 Give Kudos</button></div></section><section class="card"><h2>🏆 Current badges</h2><div class="badges">${badges().map(b=>`<div class="badge"><b>${b[0]}</b><div>${esc(b[2])}</div><small>${b[1]} · ${b[3]}</small></div>`).join('')}</div></section><section class="card"><h2>Leaderboard</h2>${sorted.map(([n,p],i)=>`<div class="rankrow"><div class="rank">#${i+1}</div><div><b>${esc(n)}</b><div class="bar"><span style="width:${Math.max(4,p/max*100)}%"></span></div></div><div class="score">${p.toFixed(2).replace('.00','')}</div></div>`).join('')}</section><section class="card"><h2>Recent activity</h2><div class="feed">${recent().map(a=>`<div class="feeditem">${activityText(a)}<br><small>${esc(a.date)}</small></div>`).join('')||'<div class="empty">Nothing logged yet.</div>'}</div></section></div>`}
const optMembers=(sel='')=>`<option value="">Select member…</option>`+state.members.map(m=>`<option ${m.name===sel?'selected':''}>${esc(m.name)}</option>`).join('');
function logForm(){return `<section class="card form"><h2>Log an activity</h2><div class="notice">Pick the activity first. The app will show only the people/fields that matter.</div><div class="field"><label>What happened?</label><select id="type" onchange="refreshRoles()"><option value="">Choose activity…</option>${state.key.filter(k=>k.type!=='Kudos').map(k=>`<option>${esc(k.type)}</option>`).join('')}</select></div><div id="rolefields"></div><div class="field"><label>Date</label><input id="date" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Notes <span class="hint">(optional)</span></label><textarea id="notes" placeholder="Anything worth remembering?"></textarea></div><button class="submit" onclick="submitActivity()">Add activity</button></section>`}
function refreshRoles(){let t=document.getElementById('type').value,c=cfg(t),box=document.getElementById('rolefields');if(!c){box.innerHTML='';return}let fields='';if(t==='Closed Business'){fields+=personField('p1','Closer');fields+=personField('p2','Referrer (optional)');fields+=`<div class="field"><label>Job size</label><select id="jobSize"><option>Small</option><option selected>Medium</option><option>Large</option></select><div class="hint">Scales the closer’s personalized goal-based points.</div></div>`}else{if(c.role1)fields+=personField('p1',c.role1);if(c.role2)fields+=personField('p2',c.role2);if(c.role3)fields+=personField('p3',c.role3)}box.innerHTML=fields+`<div class="hint" style="margin:-4px 0 14px">${esc(c.description)}</div>`}
function personField(id,label){return `<div class="field"><label>${esc(label)}</label><select id="${id}">${optMembers()}</select></div>`}
function submitActivity(){let t=document.getElementById('type').value,p1=document.getElementById('p1')?.value||'',p2=document.getElementById('p2')?.value||'',p3=document.getElementById('p3')?.value||'';if(!t||!p1){alert('Choose an activity and the first member.');return}state.activities.push({id:'a'+Date.now(),date:document.getElementById('date').value,type:t,p1,p2,p3,jobSize:document.getElementById('jobSize')?.value||'Medium',notes:document.getElementById('notes').value,seeded:false});save();go('dashboard')}
function kudosForm(){return `<section class="card form"><h2>👏 Give Kudos</h2><p style="color:var(--muted)">Quick recognition. The giver gets no points; the receiver gets 1 star.</p><div class="roles"><div class="field"><label>From</label><select id="kfrom">${optMembers()}</select></div><div class="field"><label>To</label><select id="kto">${optMembers()}</select></div></div><div class="field"><label>What are they being recognized for?</label><textarea id="knotes" placeholder="Tell the group what they did…"></textarea></div><div class="field"><label>Date</label><input id="kdate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><button class="submit" onclick="submitKudos()">Send Kudos ⭐</button></section>`}
function submitKudos(){let p1=document.getElementById('kfrom').value,p2=document.getElementById('kto').value;if(!p1||!p2){alert('Choose both people.');return}if(p1===p2){alert('Kudos should go to someone else.');return}state.activities.push({id:'k'+Date.now(),date:document.getElementById('kdate').value,type:'Kudos',p1,p2,p3:'',jobSize:'Medium',notes:document.getElementById('knotes').value,seeded:false});save();go('dashboard')}
function history(){let rows=[...state.activities].sort((a,b)=>(b.date||'').localeCompare(a.date||''));return `<section class="card"><h2>Activity history</h2><div class="tblwrap"><table class="tbl"><thead><tr><th>Date</th><th>Activity</th><th>Person 1</th><th>Person 2</th><th>Points</th><th>Notes</th></tr></thead><tbody>${rows.map(a=>{let p=ptsFor(a);return `<tr><td>${esc(a.date)}</td><td>${esc(a.type)}</td><td>${esc(a.p1||'')}</td><td>${esc(a.p2||'')}</td><td>${p.filter(Boolean).join(' / ')||'—'}</td><td>${esc(a.notes||'')}</td></tr>`}).join('')}</tbody></table></div></section>`}
function admin(){return `<div class="admin-grid"><section class="card"><h2>Members & annual goals</h2><p class="hint">Annual goal drives each person’s Closed Business point value.</p>${state.members.map((m,i)=>`<div class="memberedit"><input value="${esc(m.name)}" onchange="state.members[${i}].name=this.value;save()"><input type="number" min="1" value="${m.goal}" onchange="state.members[${i}].goal=Number(this.value)||24;save()"></div>`).join('')}</section><section class="card"><h2>Closed Business settings</h2>${Object.entries(state.multipliers).map(([k,v])=>`<div class="memberedit"><label>${k}</label><input type="number" step="0.1" value="${v}" onchange="state.multipliers['${k}']=Number(this.value);save()"></div>`).join('')}<div class="memberedit"><label>Referrer bonus</label><input type="number" step="0.05" value="${state.refBonus}" onchange="state.refBonus=Number(this.value);save()"></div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><button class="secondary" onclick="exportData()">Export backup</button> <button class="secondary danger" onclick="resetData()">Reset prototype</button><p class="hint">This prototype stores changes only in this browser. A shared database comes when we graduate it to the real group website.</p></section></div>`}
function exportData(){let b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='networking-kpi-backup.json';a.click();URL.revokeObjectURL(u)}
function resetData(){if(confirm('Reset to the spreadsheet seed data?')){state=JSON.parse(JSON.stringify(SEED));save();render()}}
function render(){nav();let m=document.getElementById('main');m.innerHTML=view==='dashboard'?dashboard():view==='log'?logForm():view==='kudos'?kudosForm():view==='history'?history():admin();if(view==='log')refreshRoles()}
render();
</script></body></html>
